<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Catalogo Plaxtilineas</title>
  <base href="/">
  
  <!-- SEO Básico -->
  <meta name="description" content="Catálogo digital de Plaxtilineas. Tu principal proveedor de plásticos, espumas y empaques en Armenia, Quindío.">
  <meta name="keywords" content="plásticos armenia, espumas armenia, empaques, plaxtilineas, catálogo de plásticos, catálogo plaxtilineas">
  <meta name="language" content="es">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="canonical" href="https://plaxtilineas.com/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">

  <!-- Precarga local de iconos Material Symbols Rounded (0 latencia de red externa, sin FOUT) -->
  <link rel="preload" href="assets/fonts/MaterialSymbolsRounded.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Core Web Vitals & Preconnects -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://res.cloudinary.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <!-- Definición crítica de Material Symbols Rounded local para evitar parpadeo o texto roto -->
  <style>
    @font-face {
      font-family: 'Material Symbols Rounded';
      font-style: normal;
      font-weight: 100 700;
      font-display: block;
      src: url('assets/fonts/MaterialSymbolsRounded.woff2') format('woff2');
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      width: 1em;
      height: 1em;
      overflow: hidden;
      vertical-align: middle;
      user-select: none;
      flex-shrink: 0;
    }
  </style>

  <!-- SEO Local (Geolocalización) -->
  <meta name="geo.placename" content="Armenia, Quindío, Colombia">
  <meta name="geo.region" content="CO-QUA">
  <meta name="geo.position" content="4.5404;-75.6898">
  <meta name="ICBM" content="4.5404, -75.6898">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Catalogo Plaxtilineas | Plásticos y Espumas">
  <meta property="og:description" content="Descubre nuestro catálogo completo de plásticos, espumas y empaques. Calidad garantizada en Armenia, Quindío.">
  <meta property="og:image" content="https://plaxtilineas.com/assets/og-image.jpg">
  <meta property="og:url" content="https://plaxtilineas.com/">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Catalogo Plaxtilineas">
  <meta name="twitter:description" content="Descubre nuestro catálogo completo de plásticos, espumas y empaques en Armenia.">
  <meta name="twitter:image" content="https://plaxtilineas.com/assets/twitter-image.jpg">

  <!-- Datos Estructurados JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Plaxtilineas",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Armenia",
      "addressRegion": "Quindío",
      "addressCountry": "CO"
    }
  }
  </script>
</head>
