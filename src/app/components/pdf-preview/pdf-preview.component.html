<div class="pdf-preview-modal" *ngIf="showPreview">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Vista Previa del Catálogo</h3>
      <button (click)="closePreview()" class="close-btn">×</button>
    </div>

    <div class="preview-content">
      <div class="loading" *ngIf="loading">
        Generando vista previa...
      </div>

      <div class="pdf-pages">
        <!-- Aquí podrías mostrar miniaturas de las páginas -->
        <div class="page" *ngFor="let page of [1,2,3]">
          <div class="page-header">
            <h4>Página {{page}}</h4>
          </div>
          <div class="page-content">
            <!-- Contenido de vista previa -->
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button (click)="closePreview()" class="btn secondary">Cancelar</button>
      <button (click)="generatePdf()" class="btn primary" [disabled]="loading">
        {{ loading ? 'Generando...' : 'Descargar PDF' }}
      </button>
    </div>
  </div>
</div>
