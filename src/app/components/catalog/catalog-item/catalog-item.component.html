<section class="product-section" [style.background]="getBackgroundGradient()">
  <div class="product-card" [class.reverse-layout]="reverseLayout">
    <!-- Sección de imágenes fijas organizadas -->
    <div class="product-images-section" [class.order-1]="reverseLayout" [class.order-2]="!reverseLayout">
      <!-- Tres imágenes organizadas verticalmente -->
      <div class="images-grid">
        <div 
          *ngFor="let img of product.images.slice(0, 3); let i = index" 
          class="fixed-image-container"
          [class.main-image]="i === 0"
          [class.secondary-image]="i > 0"
        >
          <img 
            [src]="img.url" 
            [alt]="img.description"
            class="fixed-image"
          />
          
        </div>
      </div>
    </div>

    <!-- Contenido del producto -->
    <div class="product-content" [class.order-1]="!reverseLayout" [class.order-2]="reverseLayout">
      <!-- Encabezado con estado -->
      <div class="product-header">
        
        <h2 class="product-title">
          {{ product.name }}
        </h2>
        <p class="product-category">{{ product.category }}</p>
      </div>

      <!-- Descripción -->
      <div class="product-description">
        <p>{{ product.description }}</p>
      </div>

      <!-- Especificaciones técnicas -->
      <div class="product-specs">
        <div class="spec-item">
          <span class="spec-label">Material:</span>
          <span class="spec-value">{{ product.material }}</span>
        </div>
        
        <!-- Variantes disponibles -->
        <div class="spec-item">
          <span class="spec-label">Espesores disponibles:</span>
          <div class="variants-container">
            <span 
              *ngFor="let variant of product.variants" 
              class="variant-chip"
              [class.available]="variant.available"
              [class.unavailable]="!variant.available"
            >
              {{ variant.name }}
            </span>
          </div>
        </div>

        <!-- Colores disponibles -->
        
      </div>

      <!-- Acciones -->
      <div class="product-actions">
        <button class="btn primary" (click)="contact()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z" fill="currentColor"/>
          </svg>
          <div class="button-content">
            <span class="button-title">Solicitar producto</span>
            <span class="button-subtitle">Contáctanos para más información</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</section>
