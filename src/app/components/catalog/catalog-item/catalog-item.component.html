<article class="catalog-card font-sans" (click)="openDetail($event)">

  <!-- ===== ZONA SUPERIOR: IMAGEN LIMPIA + BADGES ===== -->
  <div class="card-media">

    <!-- Badge superior izquierdo: Línea / Marca -->
    <span class="brand-pill" *ngIf="brandBadgeLabel">
      {{ brandBadgeLabel }}
    </span>

    <!-- Imagen Principal -->
    <div class="main-image-wrap">
      <img
        *ngIf="currentImageUrl"
        [src]="currentImageUrl"
        [alt]="product.name"
        class="main-img"
        loading="lazy"
      />
      <div class="no-img-state" *ngIf="!currentImageUrl">
        <span class="material-symbols-rounded">image</span>
      </div>
    </div>

    <!-- Badge inferior derecho: Contador de variantes -->
    <span class="variants-count-pill" *ngIf="variantsList.length > 1">
      <span class="material-symbols-rounded">tune</span>
      {{ variantsList.length }} variantes
    </span>

  </div>

  <!-- ===== CUERPO DE LA TARJETA ===== -->
  <div class="card-body">

    <!-- Fila Meta: Categoría a la izquierda + Material / Descripción breve a la derecha -->
    <div class="card-meta-row">
      <span class="meta-category">{{ categoryMetaLabel }}</span>
      <span class="meta-right" *ngIf="product.material || product.description" [title]="product.material || product.description || ''">
        {{ product.material || product.description }}
      </span>
    </div>

    <!-- Título del producto -->
    <h3 class="product-title" [title]="product.name">
      {{ product.name }}
    </h3>

    <!-- Chips de variantes seleccionables -->
    <div class="variants-chips" *ngIf="variantsList.length > 0">
      <button
        type="button"
        class="variant-chip"
        *ngFor="let variant of variantsList.slice(0, 4)"
        [class.is-selected]="selectedVariant === variant"
        (click)="selectVariant(variant, $event)"
        [title]="variant.name"
      >
        {{ variant.name }}
      </button>
      <span class="variant-chip variant-chip--more" *ngIf="variantsList.length > 4">
        +{{ variantsList.length - 4 }}
      </span>
    </div>

    <div class="card-spacer"></div>

    <!-- Pie de tarjeta: Precio a la izquierda + Botón Detalle / WhatsApp a la derecha -->
    <div class="card-footer">
      <div class="price-block" *ngIf="priceDisplay">
        <span class="price-caption">{{ priceCaptionLabel }}</span>
        <span class="price-value">{{ priceDisplay }}</span>
      </div>

      <div class="footer-actions">
        <button type="button" class="btn-whatsapp-icon" (click)="contact($event)" title="Cotizar por WhatsApp" aria-label="Cotizar por WhatsApp">
          <svg class="whatsapp-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.634.053-1.636-.36-1.077-.442-1.74-1.536-1.792-1.606-.053-.07-1.144-1.523-1.144-2.905 0-1.383.725-2.062.983-2.344.258-.283.563-.355.751-.355.188 0 .376.002.54.01.176.008.411-.067.643.49.238.572.812 1.979.882 2.123.07.144.117.312.023.499-.093.187-.14.305-.281.469-.141.164-.298.367-.425.493-.142.14-.289.294-.124.577.165.282.733 1.209 1.573 1.957 1.082.964 1.993 1.263 2.276 1.404.282.141.446.118.611-.07.165-.189.704-.823.892-1.106.188-.282.376-.235.634-.141.258.094 1.644.774 1.926.915.282.141.47.212.54.329.07.118.07.682-.074 1.087z"/>
          </svg>
        </button>

        <button type="button" class="btn-detail-pill" (click)="openDetail($event)">
          <span class="material-symbols-rounded">visibility</span>
          <span>Detalle</span>
        </button>
      </div>
    </div>

  </div>

</article>
