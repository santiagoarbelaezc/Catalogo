<!-- ===== NAVBAR SUTIL & MINIMALISTA — FONDO BLANCO, BOTONES NEGROS, LÍNEAS VERDE OSCURO ===== -->
<nav class="navbar-wrap print:hidden" [class.navbar-scrolled]="isScrolled">

  <!-- TOP STRIP: ENLACES A SITIOS WEB EXTERNOS -->
  <div class="navbar-top-strip">
    <div class="top-strip-inner">
      <div class="top-strip-left">
        <span class="top-strip-dot"></span>
        <span class="top-strip-label">SITIOS OFICIALES:</span>
        <div class="top-web-links">
          <a href="https://www.plaxtilineas.com/" target="_blank" rel="noopener" class="top-site-link">
            <span>Plaxtilineas</span>
            <span class="material-symbols-rounded ext-arrow">arrow_outward</span>
          </a>
          <span class="top-sep">|</span>
          <a href="https://colchonesdistricol.com/" target="_blank" rel="noopener" class="top-site-link">
            <span>Districol</span>
            <span class="material-symbols-rounded ext-arrow">arrow_outward</span>
          </a>
          <span class="top-sep">|</span>
          <a href="https://espumasyplasticos.com/" target="_blank" rel="noopener" class="top-site-link">
            <span>Espumas y Plásticos</span>
            <span class="material-symbols-rounded ext-arrow">arrow_outward</span>
          </a>
        </div>
      </div>
      <div class="top-strip-right">
        <a href="https://www.google.com/maps/dir/?api=1&destination=Cra.19+%23+19-35+Armenia+Quindio" target="_blank" class="top-pin-link">
          <fa-icon [icon]="faMapMarkerAlt" class="pin-icon"></fa-icon>
          <span>Cra 19 # 19-35 Armenia</span>
        </a>
      </div>
    </div>
  </div>

  <!-- MAIN NAVBAR -->
  <div class="navbar-main">
    <div class="navbar-container">

      <!-- LEFT: Brand Logo / Home link -->
      <a routerLink="/catalogo" class="brand-link" title="Ir al Catálogo General">
        <div class="brand-emblem">
          <span class="material-symbols-rounded">storefront</span>
        </div>
        <div class="brand-text-block">
          <div class="brand-title-wrap">
            <span class="brand-name">PLAXTI<span class="brand-name-accent">LINEAS</span></span>
            <span class="brand-dot"></span>
          </div>
          <span class="brand-tagline">Catálogo Oficial</span>
        </div>
      </a>

      <!-- CENTER: Brand Navigation Pills -->
      <div class="nav-pills-row">
        <a routerLink="/catalogo" routerLinkActive="pill-active" [routerLinkActiveOptions]="{exact: true}" class="nav-pill">
          <span class="pill-dot"></span>
          <span>General</span>
        </a>
        <a routerLink="/plaxtilineas" routerLinkActive="pill-active" class="nav-pill">
          <span class="pill-dot"></span>
          <span>Plaxtilineas</span>
        </a>
        <a routerLink="/espumasplasticos" routerLinkActive="pill-active" class="nav-pill">
          <span class="pill-dot"></span>
          <span>Espumas y Plásticos</span>
        </a>
        <a routerLink="/districol" routerLinkActive="pill-active" class="nav-pill">
          <span class="pill-dot"></span>
          <span>Districol</span>
        </a>
      </div>

      <!-- RIGHT: Action elements (Botones Negros, sin hamburguesa) -->
      <div class="navbar-actions">

        <!-- WhatsApp Button -->
        <a href="https://wa.me/573006680125" target="_blank" class="action-btn-black action-btn-whatsapp" title="Contactar por WhatsApp">
          <fa-icon [icon]="faPhone" class="action-icon-green"></fa-icon>
          <span class="hidden sm:inline">WhatsApp</span>
        </a>

        <!-- Panel Admin button (si está autenticado) -->
        <a *ngIf="isAuthenticated" routerLink="/dashboard" class="action-btn-black action-btn-admin" title="Ir al Panel de Administración">
          <fa-icon [icon]="faUserShield"></fa-icon>
          <span class="hidden sm:inline">Admin</span>
          <span class="admin-badge-dot"></span>
        </a>

        <!-- Login button (si NO está autenticado) -->
        <a *ngIf="!isAuthenticated" routerLink="/login" class="action-btn-black action-btn-login" title="Iniciar Sesión">
          <fa-icon [icon]="faStore"></fa-icon>
          <span class="hidden sm:inline">Ingresar</span>
        </a>

      </div>

    </div>
  </div>

</nav>
