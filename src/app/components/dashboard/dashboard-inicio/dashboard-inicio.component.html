<div class="min-h-screen bg-gray-50 font-sans">

  <!-- ===== TOP BAR ===== -->
  <header class="bg-white sticky top-0 z-40 px-5 pt-5 pb-4 shadow-sm">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-black rounded-3xl flex items-center justify-center shadow-lg">
          <span class="material-symbols-rounded text-white" style="font-size:1.5rem">dashboard</span>
        </div>
        <div>
          <h1 class="text-xl font-black text-gray-900 leading-tight">Panel Admin</h1>
          <p class="text-sm text-gray-400" *ngIf="currentUser">{{ currentUser.username }}</p>
        </div>
      </div>
      <button
        (click)="logout()"
        class="flex items-center gap-2 px-5 py-3 bg-gray-100 text-gray-700 text-sm font-bold rounded-2xl hover:bg-black hover:text-white active:scale-95 transition-all duration-200">
        <span class="material-symbols-rounded" style="font-size:1.1rem">logout</span>
        Cerrar Sesión
      </button>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="max-w-3xl mx-auto px-5 pb-12 pt-5">

    <!-- Loading -->
    <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-32 gap-4">
      <div class="loading-ring"></div>
      <p class="text-sm text-gray-400 font-medium">Cargando...</p>
    </div>

    <!-- Content -->
    <div *ngIf="!isLoading" class="space-y-6 animate-fade-in">

      <!-- Welcome Banner -->
      <div class="bg-black rounded-3xl p-8 text-white shadow-xl">
        <p class="text-xs uppercase tracking-widest text-gray-400 mb-2">Bienvenido de nuevo</p>
        <h2 class="text-3xl font-black leading-tight" *ngIf="currentUser">{{ currentUser.username }}</h2>
        <h2 class="text-3xl font-black leading-tight" *ngIf="!currentUser">Administrador</h2>
        <p class="text-gray-400 mt-2">{{ today | date:'EEEE, d \u2019 MMMM yyyy' }}</p>
        <div class="mt-6 flex gap-3">
          <div class="flex-1 bg-white/10 rounded-2xl p-4">
            <p class="text-xs text-gray-400 mb-1">Productos</p>
            <p class="text-3xl font-black">{{ stats.totalProducts }}</p>
          </div>
          <div class="flex-1 bg-white/10 rounded-2xl p-4">
            <p class="text-xs text-gray-400 mb-1">Categorías</p>
            <p class="text-3xl font-black">{{ stats.categories }}</p>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div>
        <p class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4 px-1">Acciones rápidas</p>
        <div class="space-y-3">

          <button
            (click)="navigateToProducts()"
            class="group w-full flex items-center gap-5 px-6 py-5 bg-white rounded-3xl shadow-sm border border-gray-100 hover:border-gray-300 hover:shadow-lg active:scale-98 transition-all duration-200 text-left">
            <div class="w-16 h-16 bg-black rounded-3xl flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform duration-200 shadow-md">
              <span class="material-symbols-rounded text-white" style="font-size:1.6rem">inventory_2</span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-black text-gray-900 text-lg">Gestionar Productos</p>
              <p class="text-sm text-gray-400 mt-0.5">Crear, editar y eliminar</p>
            </div>
            <div class="w-10 h-10 bg-gray-100 rounded-2xl flex items-center justify-center group-hover:bg-black transition-colors duration-200">
              <span class="material-symbols-rounded text-gray-400 group-hover:text-white transition-colors duration-200" style="font-size:1.2rem">arrow_forward</span>
            </div>
          </button>

        </div>
      </div>

    </div>
  </main>

</div>
