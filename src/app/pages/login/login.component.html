<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center px-4 py-10 font-sans">

  <!-- Logo / Brand area -->
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-black rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-lg">
      <span class="material-symbols-rounded text-white" style="font-size:1.8rem">storefront</span>
    </div>
    <h1 class="text-2xl font-black text-gray-900">Catálogo Admin</h1>
    <p class="text-sm text-gray-400 mt-1">Panel de administración</p>
  </div>

  <!-- Card -->
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg p-7 space-y-5">

    <h2 class="text-lg font-bold text-gray-900 text-center">Iniciar Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Email -->
      <div>
        <label class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 block">Email</label>
        <div class="relative">
          <input
            type="email"
            formControlName="email"
            [class.ring-2]="email?.invalid && email?.touched"
            class="w-full bg-gray-50 rounded-2xl px-4 py-4 text-sm text-gray-800 outline-none ring-red-400 transition-all focus:bg-white focus:ring-2 focus:ring-black"
            placeholder="tu@email.com">
        </div>
        <p class="text-xs text-red-400 mt-1.5 px-1" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">El email es requerido</span>
          <span *ngIf="email?.errors?.['email']">Formato de email inválido</span>
        </p>
      </div>

      <!-- Password -->
      <div>
        <label class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2 block">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          [class.ring-2]="password?.invalid && password?.touched"
          class="w-full bg-gray-50 rounded-2xl px-4 py-4 text-sm text-gray-800 outline-none ring-red-400 transition-all focus:bg-white focus:ring-2 focus:ring-black"
          placeholder="Tu contraseña">
        <p class="text-xs text-red-400 mt-1.5 px-1" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">La contraseña es requerida</span>
          <span *ngIf="password?.errors?.['minlength']">Mínimo 6 caracteres</span>
        </p>
      </div>

      <!-- Error general -->
      @if (loginError()) {
        <div class="flex items-center gap-2 bg-red-50 text-red-500 text-sm font-medium px-4 py-3 rounded-2xl border border-red-200">
          <span class="material-symbols-rounded shrink-0" style="font-size:1rem">error</span>
          {{ loginError() }}
        </div>
      }

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="loading() || loginForm.invalid"
        class="w-full py-4 bg-black text-white font-bold text-sm rounded-2xl hover:bg-gray-800 active:scale-98 disabled:opacity-40 transition-all shadow-md mt-2">
        @if (loading()) {
          <span class="flex items-center justify-center gap-2">
            <span class="btn-spinner"></span>
            Cargando...
          </span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>

    </form>

    <!-- Back link -->
    <div class="pt-2 border-t border-gray-100 text-center">
      <a routerLink="/catalogo"
        class="inline-flex items-center gap-1.5 text-sm text-gray-400 hover:text-black font-medium transition-colors">
        <span class="material-symbols-rounded" style="font-size:0.9rem">arrow_back</span>
        Volver al Catálogo
      </a>
    </div>

  </div>

</div>
