<app-navbar></app-navbar>

<div class="districol-page font-sans">

  <!-- ===== HERO HEADER ===== -->
  <header class="districol-hero">

    <!-- Decorative background blobs -->
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>

    <div class="hero-content">
      <div class="hero-logo-wrap">
        <h1 class="hero-title" style="letter-spacing: 2px;">DISTRICOL</h1>
      </div>

      <p class="hero-subtitle">DISTRIBUIDORA DE COLCHONES</p>

      <div class="hero-pill">
        <span class="material-symbols-rounded" style="font-size:1rem">verified</span>
        Descanso premium
      </div>
    </div>

  </header>

  <!-- ===== MESSAGE QUOTE ===== -->
  <section class="districol-quote">
    <div class="quote-card">
      <span class="material-symbols-rounded quote-icon">format_quote</span>
      <p class="quote-text">
        Nos dedicamos a mejorar tu calidad de vida a través de un descanso profundo.
        Cada colchón y producto está diseñado pensando en tu bienestar y salud.
      </p>
    </div>
  </section>

  <!-- ===== BANNER ===== -->
  <section class="districol-banner">
    <div class="banner-frame">
      <img
        src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1770094874/WhatsApp_Image_2026-02-02_at_11.59.24_PM_crlguk.jpg"
        alt="Banner Districol"
        class="banner-img"
        style="object-position: center 30%;">
      <div class="banner-overlay">
        <span class="banner-badge">
          <span class="material-symbols-rounded" style="font-size:1rem">star</span>
          El descanso perfecto
        </span>
      </div>
    </div>
  </section>

  <!-- ===== PRODUCTS ===== -->
  <section id="districol-section" class="districol-products">
    <div class="products-header">
      <div class="section-label">
        <span class="material-symbols-rounded" style="font-size:0.9rem">inventory_2</span>
        CATÁLOGO
      </div>
      <h2 class="section-title">Nuestros Productos</h2>
    </div>

    <!-- Filtros -->
    <app-catalog-filter-bar 
      [totalProducts]="filteredProducts.length"
      (filtersChanged)="applyFilters($event)">
    </app-catalog-filter-bar>

    <!-- El ngFor iterará sobre los productos reales obtenidos de la base de datos -->
    <app-catalog-item
      *ngFor="let product of paginatedProducts; let i = index"
      [product]="product"
      [reverseLayout]="i % 2 === 1">
    </app-catalog-item>

    <!-- ===== PAGINATION ===== -->
    <div class="pagination-container" *ngIf="totalPages > 1">
      <button class="page-btn prev-btn" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
        <span class="material-symbols-rounded">chevron_left</span>
      </button>

      <div class="page-numbers">
        <button 
          *ngFor="let page of pagesList" 
          class="page-btn num-btn" 
          [class.active]="page === currentPage"
          (click)="changePage(page)">
          {{ page }}
        </button>
      </div>

      <button class="page-btn next-btn" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
        <span class="material-symbols-rounded">chevron_right</span>
      </button>
    </div>
  </section>

</div>
