<app-navbar></app-navbar>

<section id="districol-section" class="catalog-section districol-container">
  <!-- Banner interactivo -->


  <div class="products-grid">
    <app-catalog-item
      *ngFor="let product of products; let i = index"
      [product]="product"
      [backgroundGradient]="'#DAA520,#D7B615'"
      [reverseLayout]="i % 2 === 1">
    </app-catalog-item>
  </div>
</section>
