<app-navbar></app-navbar>

<div class="plax-page font-sans">

  <!-- ===== HERO HEADER ===== -->
  <header class="plax-hero">

    <!-- Decorative background blobs -->
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>

    <div class="hero-content">
      <div class="hero-logo-wrap">
        <img
          src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1770774037/logo_dzyf74.png"
          alt="Plaxtilineas"
          class="hero-logo">
      </div>

      <h1 class="hero-title">PLAXTILINEAS</h1>
      <p class="hero-subtitle">TRADICIÓN QUE PROYECTA FUTURO</p>

      <div class="hero-pill">
        <span class="material-symbols-rounded" style="font-size:1rem">verified</span>
        Calidad garantizada
      </div>
    </div>

  </header>


  <!-- ===== ALLIES ===== -->
  <section class="plax-allies">
    <div class="allies-inner">

      <div class="section-label">
        <span class="material-symbols-rounded" style="font-size:0.9rem">handshake</span>
        NUESTROS ALIADOS
      </div>
      <h2 class="section-title">Marcas que nos respaldan</h2>

      <div class="brands-grid">

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/logo-plastextil_ibgjci.png" alt="Plastextil" class="brand-img">
          </div>
          <span class="brand-name">Plastextil</span>
        </div>

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878740/espumas_santafe_k82s21.png" alt="Espumas Santafé" class="brand-img">
          </div>
          <span class="brand-name">Espumas Santafé</span>
        </div>

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/espumas_medellin_dd3gcm.png" alt="Espumas Medellín" class="brand-img">
          </div>
          <span class="brand-name">Espumas Medellín</span>
        </div>

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878742/Testicol_do2hm1.png" alt="Testicol" class="brand-img">
          </div>
          <span class="brand-name">Testicol</span>
        </div>

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/POLYLON_ahvqpe.png" alt="Polylon" class="brand-img">
          </div>
          <span class="brand-name">Polylon</span>
        </div>

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878742/grupoExcala_abrci9.png" alt="Grupo Excala" class="brand-img">
          </div>
          <span class="brand-name">Grupo Excala</span>
        </div>

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/logo-pegatex_ixgyw0.png" alt="Pegatex" class="brand-img">
          </div>
          <span class="brand-name">Pegatex</span>
        </div>

        <div class="brand-card">
          <div class="brand-img-box">
            <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878742/preflex_vjabto.png" alt="Preflex" class="brand-img">
          </div>
          <span class="brand-name">Preflex</span>
        </div>

      </div>
    </div>
  </section>

  <!-- ===== PRODUCTS ===== -->
  <section id="plaxtilineas-section" class="plax-products">
    <div class="products-header">
      <div class="section-label">
        <span class="material-symbols-rounded" style="font-size:0.9rem">inventory_2</span>
        CATÁLOGO
      </div>
      <h2 class="section-title">Nuestros Productos</h2>
    </div>

    <app-catalog-item
      *ngFor="let product of paginatedProducts; let i = index"
      [product]="product"
      [reverseLayout]="i % 2 === 1">
    </app-catalog-item>

    <!-- ===== PAGINATION ===== -->
    <div class="pagination-container" *ngIf="totalPages > 1">
      <button class="page-btn prev-btn" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
        <span class="material-symbols-rounded">chevron_left</span>
      </button>

      <div class="page-numbers">
        <button 
          *ngFor="let page of pagesList" 
          class="page-btn num-btn" 
          [class.active]="page === currentPage"
          (click)="changePage(page)">
          {{ page }}
        </button>
      </div>

      <button class="page-btn next-btn" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
        <span class="material-symbols-rounded">chevron_right</span>
      </button>
    </div>
  </section>

  <!-- Botón Flotante de Impresión -->
  <button 
    class="print-fab print:hidden" 
    (click)="goToPrint()"
    title="Imprimir Catálogo Plaxtilineas">
    <span class="material-symbols-rounded">print</span>
  </button>

</div>
