<app-navbar></app-navbar>

<!-- Nueva sección de portada -->
<div class="catalog-container">

  <!-- HEADER -->
  <header class="catalog-header">
    <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1770774037/logo_dzyf74.png"
         alt="Plaxtilineas"
         class="main-logo">

    <h1>PLAXTILINEAS</h1>
    <p class="subtitle">TRADICIÓN QUE PROYECTA FUTURO</p>
  </header>

  <!-- FRASE -->
  <section class="catalog-message">
    <p>
      Ofrecemos insumos esenciales con calidad y soluciones innovadoras,
      adaptándose a cada cliente
    </p>
  </section>

  <!-- BANNER -->
  <section class="catalog-banner">
    <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1770774078/banner_i1zm0k.jpg"
         alt="Banner"
         class="banner-img">
  </section>

  <!-- ALIADOS -->
  <section class="catalog-allies">

    <h2>NUESTROS ALIADOS</h2>

    <div class="brands-grid">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/logo-plastextil_ibgjci.png" alt="Plastextil" class="brand-logo">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878740/espumas_santafe_k82s21.png" alt="Espumas Santafé" class="brand-logo">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/espumas_medellin_dd3gcm.png" alt="Espumas Medellín" class="brand-logo">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878742/Testicol_do2hm1.png" alt="Testicol" class="brand-logo">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/POLYLON_ahvqpe.png" alt="Polylon" class="brand-logo">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878742/grupoExcala_abrci9.png" alt="Grupo Excala" class="brand-logo">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878741/logo-pegatex_ixgyw0.png" alt="Pegatex" class="brand-logo">

      <img src="https://res.cloudinary.com/dsv1gdgya/image/upload/v1759878742/preflex_vjabto.png" alt="Preflex" class="brand-logo">

    </div>

  </section>

</div>

<!-- Sección original de productos -->
<section id="plaxtilineas-section" class="catalog-section plaxtilineas-container">
  <div class="products-grid">
    <app-catalog-design
      *ngFor="let product of products; let i = index"
      [product]="product"
      [backgroundGradient]="'#F0F0F0,#AAAAAA'"
      [reverseLayout]="i % 2 === 1">
    </app-catalog-design>
  </div>
</section>
