<app-navbar></app-navbar>

<section id="plaxtilineas-section" class="catalog-section plaxtilineas-container">
  <!-- Banner interactivo -->


  <div class="products-grid">
    <app-catalog-item
      *ngFor="let product of products; let i = index"
      [product]="product"
      [backgroundGradient]="'#F0F0F0,#AAAAAA'"
      [reverseLayout]="i % 2 === 1">
    </app-catalog-item>
  </div>
</section>
